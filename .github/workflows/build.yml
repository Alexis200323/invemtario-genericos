name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo6 libffi-dev libssl-dev \
          cmake libltdl-dev

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Aceptar licencias Android y preparar SDK
      run: |
        mkdir -p $HOME/.android
        echo "count=0" > $HOME/.android/repositories.cfg
        
        # Crear carpeta de licencias y aceptarlas todas
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n24333f8a63b6825ea9c5514f07c5092c9acbf6" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo -e "\nd56f5187474654c3c5f1c1f6cd9f9a0f" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
        echo -e "\n601085b94cd77f0b54ff86406957099ebe79c4d6" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license
        echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $HOME/.buildozer/android/platform/android-sdk/licenses/google-gdk-license
        echo -e "\ne9acab5b5f8911bf9275bb238fc8df4a1cfbf4d" > $HOME/.buildozer/android/platform/android-sdk/licenses/mips-android-sysimage-license

    - name: Compilar APK
      run: |
        yes | buildozer -v android debug || true
        buildozer -v android debug

    - name: Subir el APK generado
      uses: actions/upload-artifact@v4
      with:
        name: Inventario-Genericos-APK
        path: bin/*.apk
        if-no-files-found: error
