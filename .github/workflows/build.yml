name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk wget curl

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Preparar Android SDK y licencias
      run: |
        mkdir -p $HOME/.buildozer/android/platform/android-sdk
        cd $HOME/.buildozer/android/platform/android-sdk

        # Descargar commandlinetools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        unzip -q cmdtools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        mv cmdline-tools cmdline-tools_tmp 2>/dev/null || true
        mkdir -p cmdline-tools
        mv cmdline-tools_tmp/* cmdline-tools/ 2>/dev/null || true

        # Crear ruta antigua que Buildozer espera
        mkdir -p tools/bin
        ln -sf $(pwd)/cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager
        chmod +x tools/bin/sdkmanager || true

        # Aceptar licencias
        yes | ./cmdline-tools/latest/bin/sdkmanager --sdk_root=$(pwd) --licenses || true

        # Instalar exactamente lo que necesitamos
        ./cmdline-tools/latest/bin/sdkmanager --sdk_root=$(pwd) \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;34.0.0" || true

        # Crear archivos de licencia manualmente
        mkdir -p licenses
        echo -e "\n24333f8a63b6825ea9c5514f07c5092c9acbf6" > licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > licenses/android-sdk-preview-license

    - name: Compilar
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        buildozer -v android debug

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: Inventario-Genericos-APK
        path: bin/*.apk
        if-no-files-found: warn
