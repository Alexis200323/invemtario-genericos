name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk wget \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo6 libffi-dev libssl-dev \
          cmake libltdl-dev

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Preparar Android SDK + sdkmanager (solución del error)
      run: |
        # Crear estructura
        mkdir -p $HOME/.buildozer/android/platform/android-sdk
        cd $HOME/.buildozer/android/platform/android-sdk

        # Descargar Command Line Tools actualizadas
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools
        mv cmdline-tools cmdline-tools/latest 2>/dev/null || true
        # Ajuste por si el unzip crea una carpeta diferente
        if [ -d "cmdline-tools" ] && [ ! -d "cmdline-tools/latest" ]; then
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        fi

        # Crear la ruta antigua que Buildozer espera
        mkdir -p tools/bin

        # Crear enlace simbólico para que Buildozer encuentre sdkmanager
        ln -sf $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager
        chmod +x tools/bin/sdkmanager

        # Aceptar todas las licencias
        yes | ./cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | ./cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true

        # Instalar los paquetes necesarios
        ./cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

        # Crear licencias manualmente por si acaso
        mkdir -p licenses
        echo -e "\n24333f8a63b6825ea9c5514f07c5092c9acbf6" > licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > licenses/android-sdk-preview-license

    - name: Compilar APK
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        buildozer -v android debug

    - name: Subir el APK generado
      uses: actions/upload-artifact@v4
      with:
        name: Inventario-Genericos-APK
        path: bin/*.apk
        if-no-files-found: error
