name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK with official Buildozer Docker
      uses: docker://kivy/buildozer:latest
      with:
        args: android debug

    - name: Subir el APK
      uses: actions/upload-artifact@v4
      with:
        name: Inventario-Genericos-APK
        path: bin/*.apk
        if-no-files-found: warn
